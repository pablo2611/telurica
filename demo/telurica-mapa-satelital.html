<style>
:root{--bg:#0b1519;--fg:#f3efe6;--surface:rgba(15,29,34,.86);--raised:#1a2e36;--primary:#5fd0d6;--muted:#9bb0b8;--hair:rgba(243,239,230,.12);--ok:#5fd39b;--warn:#f2c14e;--orange:#f39a3c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
#map{position:fixed;inset:0}
.glass{background:var(--surface);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--hair)}
.meta{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--muted);letter-spacing:.02em}
/* barra superior */
.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;z-index:5;display:flex;align-items:center;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;border-radius:14px;padding:7px 14px 7px 8px}
.word{font-family:"Inter Tight",sans-serif;font-weight:600;letter-spacing:-.035em;font-size:1.3rem;line-height:1}.word em{font-style:normal;color:var(--primary)}
.live{display:flex;align-items:center;gap:8px;border-radius:999px;padding:7px 12px;font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;margin-left:auto}
.dot{position:relative;width:9px;height:9px;display:inline-flex}.dot i,.dot u{position:absolute;inset:0;border-radius:50%;background:var(--c,var(--ok))}.dot i{animation:ring 1.8s ease-out infinite}
@keyframes ring{to{transform:scale(2.8);opacity:0}}
/* panel lateral */
.panel{position:fixed;z-index:4;top:76px;left:12px;bottom:12px;width:360px;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;transition:transform .35s cubic-bezier(.2,1,.3,1)}
.panel.hide{transform:translateX(calc(-100% - 20px))}
.ph{padding:14px 16px 10px;border-bottom:1px solid var(--hair)}
.tabs{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.chip{height:30px;padding:0 11px;border-radius:9px;font-size:.78rem;color:var(--muted);border:1px solid var(--hair);transition:.15s;white-space:nowrap}
.chip:hover{color:var(--fg)}.chip.on{background:rgba(95,208,214,.16);color:var(--primary);border-color:rgba(95,208,214,.45)}
.row{display:flex;align-items:center;gap:10px;margin-top:10px}
input[type=range]{flex:1;accent-color:var(--primary)}
.list{list-style:none;overflow-y:auto;flex:1;padding:8px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--hair);border-radius:11px;padding:8px 10px;background:rgba(11,21,25,.45);transition:.15s}
.item:hover,.item.sel{border-color:rgba(95,208,214,.5);background:rgba(95,208,214,.08)}
.item.new{animation:pop .5s cubic-bezier(.2,1.4,.4,1);border-color:rgba(95,208,214,.6)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mag{display:grid;place-items:center;width:42px;height:38px;flex-shrink:0;border-radius:9px;font-family:"IBM Plex Mono",monospace;font-weight:600;color:#0b1519}
.item b{display:block;font-weight:500;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-family:"IBM Plex Mono",monospace;font-size:.56rem;text-transform:uppercase;padding:1px 5px;border-radius:4px;background:var(--primary);color:#0b1519;margin-left:5px;vertical-align:2px}
/* ficha */
.detail{position:fixed;z-index:4;top:76px;right:12px;width:330px;max-height:calc(100% - 160px);overflow:auto;border-radius:18px;padding:16px;opacity:0;transform:translateX(16px);pointer-events:none;transition:.3s cubic-bezier(.2,1,.3,1)}
.detail.show{opacity:1;transform:none;pointer-events:auto}
.big{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:2.6rem;line-height:1}
dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px;font-size:.84rem}
dt{font-family:"IBM Plex Mono",monospace;font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pager{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.62rem;text-transform:uppercase;font-weight:600;padding:2px 8px;border-radius:999px;color:#111}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);border-radius:10px;padding:8px 12px;font-size:.82rem;text-decoration:none;margin-top:14px}
.btn:hover{border-color:rgba(95,208,214,.5);color:var(--primary)}
.x{width:30px;height:30px;border-radius:8px;border:1px solid var(--hair)}
/* controles flotantes */
.dock{position:fixed;z-index:4;right:12px;bottom:max(34px,calc(env(safe-area-inset-bottom) + 24px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.seg{display:flex;gap:3px;padding:4px;border-radius:13px}
.legend{border-radius:12px;padding:8px 11px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:.7rem}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.toggle{position:fixed;z-index:5;left:12px;bottom:max(34px,calc(env(safe-area-inset-bottom) + 24px));border-radius:12px;padding:9px 13px;font-size:.82rem;display:none}
.toast{position:fixed;z-index:9;left:50%;top:80px;transform:translate(-50%,-20px);opacity:0;transition:.35s;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;pointer-events:none;max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;color:var(--muted)}
.maplibregl-ctrl-group{background:var(--surface)!important;border:1px solid var(--hair);box-shadow:none!important;border-radius:12px!important;backdrop-filter:blur(14px)}
.maplibregl-ctrl-group button{width:36px!important;height:36px!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1) brightness(.95)}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--hair)!important}
.maplibregl-ctrl-attrib{background:rgba(11,21,25,.7)!important;color:var(--muted)!important;font-size:10px}.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.maplibregl-ctrl-scale{background:rgba(11,21,25,.6)!important;color:var(--fg)!important;border-color:var(--fg)!important}
.maplibregl-popup-content{background:var(--raised)!important;color:var(--fg);border:1px solid var(--hair);border-radius:12px!important;padding:10px 12px!important;font-size:.82rem;box-shadow:0 12px 30px -10px #000}
.maplibregl-popup-tip{display:none}
@media(max-width:760px){
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;height:46vh;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .panel.hide{transform:translateY(calc(100% + 10px))}
  .toggle{display:block;bottom:calc(46vh + 10px)}
  .panel.hide~.toggle{bottom:max(24px,env(safe-area-inset-bottom))}
  .detail{top:auto;bottom:0;left:0;right:0;width:auto;max-height:62vh;border-radius:18px 18px 0 0;transform:translateY(30px);padding-bottom:max(16px,env(safe-area-inset-bottom));z-index:6}
  .detail.show{transform:none}
  .dock{top:calc(max(12px,env(safe-area-inset-top)) + 54px);bottom:auto;left:12px;right:12px;flex-direction:row;align-items:center;overflow-x:auto;scrollbar-width:none;gap:6px}
  .dock::-webkit-scrollbar{display:none}
  .seg{flex-shrink:0;padding:3px}.chip{height:28px;padding:0 9px;font-size:.74rem}
  .legend{display:none}
  .word{font-size:1.1rem}
  .maplibregl-ctrl-bottom-right{bottom:calc(46vh + 4px)}
  .panel.hide~.maplibregl-ctrl-bottom-right{bottom:0}
}
</style>
</head>

  const nf = nearestFault(e), pl = plateOf(e), st = stratum(e.d), al = { orange: ["Naranja", "#f39a3c"], yellow: ["Amarilla", "#f2c14e"], green: ["Verde", "#5fd39b"], red: ["Roja", "#f0614f"] }[e.alert];
  const d = $("detail");
  d.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:start;gap:10px"><div><span class="meta">${fDate(e.t)} · ${fTime(e.t)} hora de Panamá</span><div class="big" style="color:${magColor(e.m)};margin-top:6px">${e.m.toFixed(1)} <span class="meta">${esc(e.mt)}</span></div></div><button class="x" id="dx" aria-label="Cerrar">✕</button></div>
    <p style="margin-top:8px;font-weight:500">${esc(title(e))}</p><p class="meta">${esc(placeEs(e.place))}</p>
    <dl><div><dt>Profundidad</dt><dd>${e.d.toFixed(0)} km · ${e.d < 70 ? "superficial" : e.d < 300 ? "intermedia" : "profunda"}</dd></div><div><dt>Zona</dt><dd>${e.c === "maritima" ? "Marítima" : "Terrestre"}</dd></div>
    <div><dt>Lo sintieron</dt><dd>${e.felt ?? "s/d"}</dd></div><div><dt>Intensidad</dt><dd>${e.mmi ? "MMI " + (+e.mmi).toFixed(1) : e.cdi ? "CDI " + (+e.cdi).toFixed(1) : "s/d"}</dd></div>
    <div><dt>Alerta PAGER</dt><dd>${al ? `<span class="pager" style="background:${al[1]}">${al[0]}</span>` : "—"}</dd></div><div><dt>Fuente</dt><dd>${e.srcs.join(" + ")}${e.prelim ? " · prelim." : ""}</dd></div>
    <div style="grid-column:1/-1"><dt>Falla más cercana</dt><dd><button id="df" style="text-decoration:underline;text-underline-offset:3px;color:${nf.f.k === "limite" ? "#ff5a4f" : "#ffb347"};text-align:left">${esc(nf.f.n)}</button> <span class="meta">a ${nf.d.toFixed(0)} km</span></dd></div>
    <div><dt>Placa</dt><dd><span style="color:${pl.c}">●</span> ${esc(pl.n)}</dd></div><div><dt>Roca en el foco</dt><dd>${esc(st.n.split(" (")[0])}</dd></div>
    <div style="grid-column:1/-1"><dt>Energía</dt><dd>≈ ${Math.pow(10, 1.5 * (e.m - 4)).toLocaleString("es-PA", { maximumFractionDigits: 0 })} × un sismo M4.0</dd></div></dl>
    <a class="btn" href="${e.url}" target="_blank" rel="noreferrer">Ver reporte en ${e.src} ↗</a>`;
  d.classList.add("show"); $("dx").onclick = closeDetail; $("df").onclick = () => selectFault(nf.f.id);
  if (window.innerWidth < 760) $("panel").classList.add("hide");
}
function selectFault(id) {
  const f = FAULTS.find(x => x.id === id); if (!f) return; sel = null; map.setFilter("q-sel", ["==", ["get", "id"], ""]); map.setFilter("f-sel", ["==", ["get", "id"], id]);
  if (!layersOn.faults) { layersOn.faults = true; $("lay").querySelector('[data-l="faults"]').classList.add("on"); applyLayers("faults"); }
  const near = [...EV.values()].filter(e => f.p.some((a, i) => i && segKm(e.lon, e.lat, f.p[i - 1], a) < 25));
  const col = f.k === "limite" ? "#ff5a4f" : "#ffb347";
  const b = new maplibregl.LngLatBounds(f.p[0], f.p[0]); f.p.forEach(p => b.extend(p)); map.fitBounds(b, { padding: { top: 120, bottom: 120, left: window.innerWidth < 760 ? 30 : 400, right: window.innerWidth < 760 ? 30 : 360 }, maxZoom: 9.5, pitch: layersOn.terrain ? 50 : 0, duration: 1400 });
  const d = $("detail");
  d.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:start;gap:10px"><span class="pager" style="background:${col}">${f.k === "limite" ? "Límite de placa" : "Falla cortical"}</span><button class="x" id="dx" aria-label="Cerrar">✕</button></div>
    <p style="margin-top:12px;font-family:'Inter Tight';font-weight:600;font-size:1.3rem;line-height:1.15;letter-spacing:-.02em">${esc(f.n)}</p>
    <dl><div><dt>Tipo</dt><dd>${esc(f.t)}</dd></div><div><dt>Tasa</dt><dd>${f.r || "s/d"}</dd></div>
    <div style="grid-column:1/-1"><dt>Sismos a ≤ 25 km (cargados)</dt><dd>${near.length}${near.length ? ` · mayor M${Math.max(...near.map(e => e.m)).toFixed(1)}` : ""}</dd></div></dl>
    <p style="margin-top:12px;font-size:.86rem;color:var(--muted)">${esc(f.d)}</p><p class="meta" style="margin-top:10px">Traza simplificada a escala regional.</p>`;
  d.classList.add("show"); $("dx").onclick = closeDetail;
}
function closeDetail() { sel = null; $("detail").classList.remove("show"); if (map.getLayer("q-sel")) { map.setFilter("q-sel", ["==", ["get", "id"], ""]); map.setFilter("f-sel", ["==", ["get", "id"], ""]); } document.querySelectorAll(".item.sel").forEach(i => i.classList.remove("sel")); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

/* ---------- pulso de sismos recientes (ligero: ~30 fps y solo si hay recientes) ---------- */
let lastP = 0;
function pulse(now = 0) {
  requestAnimationFrame(pulse);
  if (now - lastP < 33 || document.hidden || !map.getLayer("q-pulse") || !layersOn.quakes) return; lastP = now;
  const k = (now % 2000) / 2000;
  map.setPaintProperty("q-pulse", "circle-radius", RZ(1 + k * 2.2));
  map.setPaintProperty("q-pulse", "circle-stroke-opacity", 0.85 * (1 - k));
}

/* ---------- arranque ---------- */
connectWs();
loadHistory().then(() => { pollUsgs(); setInterval(pollUsgs, 30000); });
setInterval(async () => { if (snapshot) return; try { const s = new Date(Date.now() - 864e5).toISOString().slice(0, 19); const r = await fetchT(`https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&eventtype=earthquake&orderby=time&minmagnitude=2&starttime=${s}&${BBOX}`); const j = await r.json(); let n = 0; j.features.forEach(f => { if (addEvent(fromUsgs(f), true)) n++; }); render(); } catch {} }, 120000);
setInterval(() => render(), 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { pollUsgs(); if (!ws || ws.readyState === 3) connectWs(); } });

</script>
</body>
</html>
