name: Verify Savia in browsers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser tools in the GitHub runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify chat on mobile and desktop
        run: |
          npm run start > /tmp/telurica-browser.log 2>&1 &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          node src/test/savia-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: savia-browser
          path: test-results/savia/
