name: Verify terrain explorer
on:
  workflow_dispatch:
concurrency:
  group: terrain-browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  terrain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-generated-route-tree
          path: src/routeTree.gen.ts
      - name: Install browser tools on GitHub
        run: |
          npm install --prefix /tmp/terrain-browser playwright@1.56.1
          /tmp/terrain-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify rural and urban exploration
        env:
          TERRAIN_BROWSER_MODULE: /tmp/terrain-browser/node_modules/playwright/index.mjs
        run: |
          npm run start > /tmp/terrain-browser.log 2>&1 &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          node src/test/terrain-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-browser
          path: test-results/terrain/
